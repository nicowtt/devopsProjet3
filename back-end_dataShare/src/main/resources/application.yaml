spring:
  application:
    name: dataShare

  docker:
    compose:
      enabled: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

logging:
  level:
    org:
      hibernate:
        type: info
      springframework:
        web:
          filter:
            CommonsRequestLoggingFilter: info
    com:
      openclassrooms:
        dataShare: info

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # millisecondes / 24h here

management:
  endpoints:
    web:
      exposure:
        include: '*'

file:
  upload-dir: files

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
  override-with-generic-response: false